name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest

    # Signing values are exposed to every step (including the release unit-test
    # step, which configures the release variant) so the build's signing guard
    # is satisfied throughout the job.
    # Job-level env is available to every step. The `runner` context is NOT
    # valid here, so the keystore path uses `github.workspace` instead.
    env:
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/fuelnivo-release-key.p12
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android Platform 36 and Build Tools 36.0.0
        run: |
          # Use the Android SDK preinstalled on the runner instead of
          # android-actions/setup-android, which can break on newer runner
          # images while reconciling cmdline-tools and accepting licenses.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pin the provisioned Gradle to a version compatible with AGP 8.11.x.
          # The runner's default Gradle (9.x) is not compatible with AGP 8.11
          # and would fail while generating the wrapper / configuring the build.
          gradle-version: "8.13"

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.13
          fi

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Strip any whitespace/newlines that may have been introduced when the
          # secret value was pasted, then decode. Fail loudly if the result is
          # not a valid PKCS12 keystore.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          if [ ! -s "$ANDROID_KEYSTORE_FILE" ]; then
            echo "Decoded keystore is empty — check the ANDROID_KEYSTORE_BASE64 secret." >&2
            exit 1
          fi
          echo "Keystore decoded: $(wc -c < "$ANDROID_KEYSTORE_FILE") bytes"

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Build signed release AAB
        run: ./gradlew bundleRelease --no-daemon

      - name: Locate release APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found" >&2
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at $APK_PATH"

      - name: Verify APK signature and certificate
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/36.0.0)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --print-certs "${{ steps.find_apk.outputs.apk_path }}" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "ERROR: Release artifact is signed with the Android Debug certificate." >&2
            exit 1
          fi
          echo "Signature verification passed."

      - name: Upload signed APK (test artifact)
        uses: actions/upload-artifact@v4
        with:
          name: fuelnivo-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload signed AAB (Google Play artifact)
        uses: actions/upload-artifact@v4
        with:
          name: fuelnivo-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
